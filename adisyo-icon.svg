      <stop offset="0" stop-color="#22A6E0"/>
      <stop offset=".55" stop-color="#3F6FD8"/>
      <stop offset="1" stop-color="#7A4FD0"/>
    </linearGradient>
    <linearGradient id="ck" x1="0" y1="0" x2="1" y2="1">
