name: Status aktualisieren
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Status holen
        run: python3 tools/fetch.py /tmp/status.json
      - name: In Zweig "data" ablegen (immer nur ein Commit)
        run: |
          cd /tmp && rm -rf pub && mkdir pub && cp status.json pub/ && cd pub
          git init -q -b data
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -q -m "status $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
